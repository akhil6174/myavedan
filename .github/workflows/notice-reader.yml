name: Notice reader

# Runs on a computer in India (self-hosted runner labelled "india"): the free Oracle Cloud server in
# Mumbai/Hyderabad, or the owner's Windows PC as a backup. Many government sites don't answer
# GitHub's US servers. See docs/ORACLE_SERVER.md and docs/PC_RUNNER.md.
#
# Safety: this workflow never runs for pull requests. It starts only on its schedule or when the
# owner presses Run workflow.
on:
  schedule:
    # 11:00 and 19:00 IST. If no runner is online, the run waits and then expires; nothing breaks.
    - cron: "30 5 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: What to do
        type: choice
        options: [discover, golden]
        default: discover
      max_new:
        description: Most new notices to read in this run
        default: "10"
      from_backlog:
        description: Also read this many notices already on the sites before the first visit
        default: "0"
      dry_run:
        description: Save results only, don't send to the review console
        type: boolean
        default: false

concurrency:
  group: notice-reader
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  read:
    if: github.repository == 'akhil6174/myavedan'
    runs-on: [self-hosted, india]
    timeout-minutes: 180
    env:
      PYTHONUTF8: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      INGEST_URL: https://api-staging.myavedan.in/api/ingest
      INGEST_HMAC_SECRET: ${{ secrets.STAGING_INGEST_SECRET }}
      READER_MODE: ${{ github.event.inputs.mode || 'discover' }}
      READER_MAX_NEW: ${{ github.event.inputs.max_new || '10' }}
      READER_FROM_BACKLOG: ${{ github.event.inputs.from_backlog || '0' }}
      READER_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v4

      # Linux server: packages live in a virtual environment set up by deploy/oracle/setup-runner.sh.
      - name: Read notices (Linux server)
        if: runner.os == 'Linux'
        working-directory: pipeline
        shell: bash
        run: |
          VENV="$HOME/.myavedan/venv"
          [ -x "$VENV/bin/python" ] || python3 -m venv "$VENV"
          "$VENV/bin/pip" install --quiet --disable-pip-version-check -r requirements.txt
          "$VENV/bin/python" -m myavedan_pipeline.cli scheduled

      - name: Read notices (Windows PC)
        if: runner.os == 'Windows'
        working-directory: pipeline
        shell: powershell
        run: |
          python -m pip install --quiet --disable-pip-version-check -r requirements.txt
          python -m myavedan_pipeline.cli scheduled
