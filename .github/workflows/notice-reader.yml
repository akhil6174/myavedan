name: Notice reader

# Runs on a computer in India (self-hosted runner labelled "india"), because many government
# sites don't answer GitHub's US servers. See docs/PC_RUNNER.md.
#
# Safety: this workflow never runs for pull requests. It starts only on its schedule or when the
# owner presses Run workflow.
on:
  schedule:
    # 11:00 and 19:00 IST. If the runner is offline, the run waits and then expires; nothing breaks.
    - cron: "30 5 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: What to do
        type: choice
        options: [discover, golden]
        default: discover
      max_new:
        description: Most new notices to read in this run
        default: "10"
      from_backlog:
        description: Also read this many notices already on the sites before the first visit
        default: "0"
      dry_run:
        description: Save results only, don't send to the review console
        type: boolean
        default: false

concurrency:
  group: notice-reader
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  read:
    if: github.repository == 'akhil6174/myavedan'
    runs-on: [self-hosted, india]
    timeout-minutes: 180
    env:
      PYTHONUTF8: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      INGEST_URL: https://api-staging.myavedan.in/api/ingest
      INGEST_HMAC_SECRET: ${{ secrets.STAGING_INGEST_SECRET }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Install reader packages
        run: python -m pip install --quiet --disable-pip-version-check -r pipeline/requirements.txt

      - name: Read notices
        working-directory: pipeline
        run: |
          $mode = "${{ github.event.inputs.mode }}"; if (-not $mode) { $mode = "discover" }
          $cliArgs = @($mode)
          if ($mode -eq "discover") {
            $max = "${{ github.event.inputs.max_new }}"; if (-not $max) { $max = "10" }
            $backlog = "${{ github.event.inputs.from_backlog }}"; if (-not $backlog) { $backlog = "0" }
            $cliArgs += @("--max-new", $max, "--from-backlog", $backlog)
          }
          if ("${{ github.event.inputs.dry_run }}" -eq "true") { $cliArgs += "--dry-run" }
          python -m myavedan_pipeline.cli @cliArgs
