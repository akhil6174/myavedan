name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-and-api:
    name: Types, tests, snapshot, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate snapshot
        run: npm run validate:snapshot
      - name: Unit tests (schema, eligibility, API)
        run: npm test
      - name: Type check
        run: npm run check
      - name: Build site and search index
        run: npm run build
      - name: Build review console
        run: npm run build:admin
      - name: D1 migrations apply cleanly
        working-directory: apps/api
        run: npx wrangler d1 migrations apply myavedan --local
        env:
          CI: "1"
          WRANGLER_SEND_METRICS: "false"

  pipeline:
    name: Pipeline tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
